<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชทกับเรา</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; height: 100dvh; display: flex; flex-direction: column; background: #8cabd9; }
  input, button { font: inherit; padding: 10px 12px; border: 1px solid #ccc; border-radius: 20px; }
  button { background: #06c755; color: #fff; border: 0; cursor: pointer; }
  header { background: #06c755; color: #fff; padding: 14px 16px; font-weight: bold; }
  #start { margin: auto; background: #fff; padding: 24px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; width: min(320px, calc(100% - 32px)); }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 16px; background: #fff; align-self: flex-start; white-space: pre-wrap; word-break: break-word; }
  .msg.in { background: #85e249; align-self: flex-end; }
  .msg time { display: block; font-size: 11px; color: #666; margin-top: 2px; }
  #send { display: flex; gap: 8px; padding: 10px; background: #fff; }
  #send input { flex: 1; min-width: 0; }
</style>
</head>
<body>
<header>แชทกับเรา</header>

<form id="start" hidden>
  <b>ชื่อของคุณ</b>
  <input id="name" maxlength="50" autocomplete="name" required>
  <button>เริ่มแชท</button>
</form>

<div id="msgs" hidden></div>
<form id="send" hidden>
  <input id="text" placeholder="พิมพ์ข้อความ" autocomplete="off">
  <button>ส่ง</button>
</form>

<script>
const SUPABASE_URL = 'https://yuhpiwakmfczpovffgtx.supabase.co'; // ← แก้
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1aHBpd2FrbWZjenBvdmZmZ3R4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MDkzMzAsImV4cCI6MjEwOTA4NTMzMH0.VH4JN-QqGVXPyWPnKRCr7aADihGvFNtqrZYs4XkCqJw';     // ← แก้

// storageKey แยกจากหน้าแอดมิน เผื่อเปิดสองหน้าในเบราว์เซอร์เดียวกัน
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'oa-customer' } });
const $ = (id) => document.getElementById(id);
let me = null;

function addMsg(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.direction;
  el.textContent = m.text;
  const t = document.createElement('time');
  t.textContent = new Date(m.created_at).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
  el.append(t);
  $('msgs').append(el);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

async function start() {
  const { data: { session } } = await db.auth.getSession();
  $('start').hidden = !!session;
  $('msgs').hidden = $('send').hidden = !session;
  if (!session) return;
  me = session.user.id;
  // ponytail: 200 ข้อความล่าสุด
  const { data } = await db.from('messages').select().order('created_at', { ascending: false }).limit(200);
  data.reverse().forEach(addMsg);
  db.channel('me')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, ({ new: m }) => addMsg(m))
    .subscribe();
  $('text').focus();
}

$('start').onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await db.auth.signInAnonymously({ options: { data: { name: $('name').value.trim() } } });
  if (error) return alert(error.message);
  start();
};

$('send').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  // ข้อความจะโผล่เองผ่าน realtime
  const { error } = await db.from('messages').insert({ contact_id: me, direction: 'in', text });
  if (error) { alert('ส่งไม่สำเร็จ: ' + error.message); $('text').value = text; }
};

start();
</script>
</body>
</html>
